name: Terra Léman — CI

on:
  pull_request:
    paths:
      - 'terra-leman/**'
      - '.github/workflows/terra-leman-*.yml'
  push:
    branches: [main]
    paths:
      - 'terra-leman/**'

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terra-leman/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terra-leman/pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terra-leman/web
    steps:
      - uses: actions/checkout@v4
      # TEMP: the web app sources land in a follow-up commit of this branch.
      - uses: actions/setup-node@v4
        if: hashFiles('terra-leman/web/src/main.tsx') != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terra-leman/web/package-lock.json
      - run: npm ci
        if: hashFiles('terra-leman/web/src/main.tsx') != ''
      - run: npm run typecheck
        if: hashFiles('terra-leman/web/src/main.tsx') != ''
      - run: npm run build
        if: hashFiles('terra-leman/web/src/main.tsx') != ''
