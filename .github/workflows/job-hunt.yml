name: Job Hunter

on:
  schedule:
    - cron: '30 11 * * *' # Every day at 13:30 Geneva (11:30 UTC)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  id-token: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Resume repository
        uses: actions/checkout@v4
        with:
          repository: Onigam/resume
          path: resume-repo
          fetch-depth: 1

      - name: Prepare LinkedIn cookie
        run: echo "$LINKEDIN_COOKIE" > /tmp/linkedin_cookie.txt
        env:
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (for Resume repo)
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Git
        run: |
          git config user.name "Magino"
          git config user.email "13470680+Onigam@users.noreply.github.com"

      - name: Setup Resume Repo (Install & Build dependencies)
        run: |
          cd resume-repo/website
          pnpm install
          npx playwright install chromium --with-deps

      - name: Run Job Hunter (Search & Score)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          fi
          
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ Missing Claude credentials."
            exit 1
          fi

          echo "Running Job Hunter Search..."
          claude -p --dangerously-skip-permissions --output-format text < .claude/prompts/job-hunter-orchestrator-v2.md

      - name: Generate Application Packages (for A/B grades)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          fi
          
          DATE=$(date +%Y-%m-%d)
          JSON_FILE="data/daily/${DATE}.json"
          
          if [ ! -f "$JSON_FILE" ]; then
            echo "No JSON file found. Skipping application generation."
            exit 0
          fi
          
          # Find all A and B grade offers from today's JSON
          # We use jq to extract title, company, url for each
          OFFERS=$(cat "$JSON_FILE" | jq -c '.top_offers[] | select(.grade == "A" or .grade == "B")')
          
          echo "$OFFERS" | while read -r offer; do
            TITLE=$(echo "$offer" | jq -r '.title')
            COMPANY=$(echo "$offer" | jq -r '.company')
            URL=$(echo "$offer" | jq -r '.url')
            
            echo "Generating application package for: $TITLE @ $COMPANY"
            
            # The script prepare-application.sh relies on REPO_DIR and RESUME_DIR env vars or defaults
            # Let's override paths for the GitHub Action environment
            export REPO_DIR="$GITHUB_WORKSPACE"
            export RESUME_DIR="$GITHUB_WORKSPACE/resume-repo"
            
            # Run the preparation script
            ./scripts/prepare-application.sh "$URL" "$TITLE" "$COMPANY" "classic" || echo "Failed to generate package for $COMPANY"
          done
          
          # Commit the generated packages
          git add data/
          git commit -m "🚀 Generated application packages for top offers — $DATE" || echo "No packages to commit"
          git push || echo "Push failed"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          MSG_FILE="data/daily/${DATE}-telegram.txt"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not configured. Skipping notification."
            exit 0
          fi

          if [ -f "$MSG_FILE" ]; then
            MSG=$(head -c 4000 "$MSG_FILE")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$MSG"
          fi
