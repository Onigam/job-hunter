name: Job Hunter

on:
  schedule:
    - cron: '30 11 * * *' # Every day at 13:30 Geneva (11:30 UTC)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare LinkedIn cookie
        run: echo "$LINKEDIN_COOKIE" > /tmp/linkedin_cookie.txt
        env:
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Git
        run: |
          git config user.name "Magino"
          git config user.email "13470680+Onigam@users.noreply.github.com"

      - name: Run Job Hunter (Search & Score)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          fi

          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ Missing Claude credentials."
            exit 1
          fi

          echo "Running Job Hunter Search..."
          claude -p --dangerously-skip-permissions --output-format text < .claude/prompts/job-hunter-orchestrator-v2.md

      - name: Generate Application Packages (for A/B grades)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          fi

          DATE=$(date +%Y-%m-%d)
          JSON_FILE="data/daily/${DATE}.json"

          if [ ! -f "$JSON_FILE" ]; then
            echo "No JSON file found. Skipping application generation."
            exit 0
          fi

          OFFERS=$(cat "$JSON_FILE" | jq -c '.top_offers[] | select(.grade == "A" or .grade == "B")')

          echo "$OFFERS" | while read -r offer; do
            TITLE=$(echo "$offer" | jq -r '.title')
            COMPANY=$(echo "$offer" | jq -r '.company')
            URL=$(echo "$offer" | jq -r '.url')

            echo "Generating application package for: $TITLE @ $COMPANY"

            COMPANY_SLUG=$(echo "$COMPANY" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
            OUTPUT_DIR="$GITHUB_WORKSPACE/data/applications/$DATE-$COMPANY_SLUG"
            mkdir -p "$OUTPUT_DIR"

            PROMPT="You are preparing a complete job application package for Magino Marveaux-Cochet.

            Follow the instructions in .claude/agents/application-builder.md strictly — especially the Anti-AI-Detection Rules and content rules in CLAUDE.md (no em-dashes, no 'excited to', no 'leverage'/'synergy', contractions allowed, sentence length variation).

            Job details:
            - Title: $TITLE
            - Company: $COMPANY
            - URL: $URL

            Profile sources:
            - profile/context.md — core profile, skills, target roles
            - profile/star-bank.md — STAR behavioral stories (if present)

            Steps:
            1. Fetch the job description from the URL (WebFetch or web search)
            2. Read profile/context.md and profile/star-bank.md
            3. Generate the following files in $OUTPUT_DIR/ :
               - cover-letter.md (max 230 words, 3 paragraphs of plain prose, no headers, no bullets)
               - star-stories.md (3-5 STAR+R answers, flowing prose in first person)
               - negotiation-script.md (Switzerland market anchors, counter-offer scripts, equity notes)
            4. After writing the files, print exactly: APPLICATION_DOCS_DONE
            "

            claude -p --dangerously-skip-permissions --output-format text <<< "$PROMPT" || echo "Failed to generate package for $COMPANY"
          done

          git add data/
          git commit -m "🚀 Generated application packages for top offers — $DATE" || echo "No packages to commit"
          git push || echo "Push failed"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          MSG_FILE="data/daily/${DATE}-telegram.txt"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not configured. Skipping notification."
            exit 0
          fi

          if [ -f "$MSG_FILE" ]; then
            MSG=$(head -c 4000 "$MSG_FILE")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$MSG"
          fi
