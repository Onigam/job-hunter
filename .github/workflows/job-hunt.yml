name: Job Hunter

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 UTC (9:00 Geneva)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Job Hunter with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the Job Hunter orchestrator. Your goal is to find the best new job offers for the candidate.

            Follow these steps carefully:

            ## Step 1: Understand the Profile
            Read `profile/context.md` to understand the candidate's background, skills, and preferences.

            ## Step 2: Load Existing Offers
            Read `data/offers.json` to know which offers have already been found (for deduplication).

            ## Step 3: Search for New Offers
            Use the `job-searcher` agent (via Task tool) to search for new job offers.
            Run multiple searches across different platforms and keywords:
            - LinkedIn Jobs: "Staff Engineer" Geneva, "Platform Engineer" remote, "Founding Engineer" startup Switzerland
            - Indeed/SwissDevJobs: Senior engineering roles in Geneva/Switzerland
            - Wellfound/Remote boards: Startup founding/staff roles, remote-friendly
            - Include searches for CTO/VP Engineering at early-stage startups in Geneva
            Aim for 15-25 raw results.

            ## Step 4: Match and Rank
            Use the `profile-matcher` agent (via Task tool) to:
            - Deduplicate against existing offers
            - Score each new offer against the profile
            - Return the top 5 most relevant new offers

            ## Step 5: Generate Report
            Use the `report-builder` agent (via Task tool) to:
            - Create `data/daily/YYYY-MM-DD.json` with today's results
            - Update `data/offers.json` with new offers
            - Generate `data/daily/YYYY-MM-DD-telegram.txt` with the Telegram message

            ## Step 6: Commit Changes
            Use Bash to commit and push changes:
            ```bash
            git config user.name "Job Hunter Bot"
            git config user.email "bot@job-hunter.github.io"
            git add data/
            git commit -m "🎯 Daily job hunt — $(date +%Y-%m-%d)" || echo "No changes to commit"
            git push
            ```

            IMPORTANT: Only include REAL job offers found via WebSearch. Never fabricate or hallucinate offers.
            Use today's date for all file names and timestamps.
          allowed_tools: "Bash(git:*),Bash(date:*),Read,Write,Edit,Glob,Grep,WebSearch,Task"
          claude_args: "--max-turns 40"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          MSG_FILE="data/daily/${DATE}-telegram.txt"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not configured. Skipping notification."
            exit 0
          fi

          if [ -f "$MSG_FILE" ]; then
            # Telegram has a 4096 char limit, truncate if needed
            MSG=$(head -c 4000 "$MSG_FILE")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || echo "⚠️ Telegram send failed, trying without markdown"

            # Retry without markdown if it failed
            if [ $? -ne 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode text="$MSG"
            fi
          else
            echo "No Telegram message file found for today (${MSG_FILE})"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="🎯 Job Hunter — ${DATE}

⚠️ No results generated today. Check workflow logs." \
              -d parse_mode="Markdown" || true
          fi
