name: Job Hunter

on:
  schedule:
    - cron: '0 7 * * *' # Every day at 8:00 Geneva (7:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare LinkedIn cookie
        run: echo "$LINKEDIN_COOKIE" > /tmp/linkedin_cookie.txt
        env:
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Configure Git
        run: |
          git config user.name "Magino"
          git config user.email "13470680+Onigam@users.noreply.github.com"

      - name: Run Job Hunter with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TEMP_PROMPT_FILE=$(mktemp)
          cat > "$TEMP_PROMPT_FILE" <<'PROMPT_EOF'
          You are the Job Hunter orchestrator. Your goal is to find the best new job offers for the candidate.

          Follow these steps carefully:

          ## Step 1: Understand the Profile
          Read `profile/context.md` to understand the candidate's background, skills, and preferences.

          ## Step 2: Load Existing Offers
          Read `data/offers.json` to know which offers have already been found (for deduplication).

          ## Step 3: Search for New Offers
          Follow the search instructions in `.claude/agents/job-searcher.md` to search for new job offers.
          Run multiple searches across different platforms and keywords.

          ### LinkedIn Authenticated Search (PRIMARY SOURCE)
          A LinkedIn session cookie (`li_at` value) is available in the file `/tmp/linkedin_cookie.txt`.
          Read it, then use the value in curl commands to search LinkedIn's job search API.

          ### Web Search (SECONDARY SOURCES)
          Also use WebSearch to find jobs on Indeed/SwissDevJobs, Wellfound/Remote boards, and HN Who's Hiring.

          ## Step 4: Match and Rank
          Follow `.claude/agents/profile-matcher.md` to deduplicate and score.

          ## Step 5: Generate Report
          Follow `.claude/agents/report-builder.md` to:
          - Create `data/daily/YYYY-MM-DD.json`
          - Update `data/offers.json`
          - Generate `data/daily/YYYY-MM-DD-telegram.txt`

          ## Step 6: Commit Changes
          git add data/
          git commit -m "🎯 Daily job hunt — $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

          IMPORTANT: Only include REAL job offers found via WebSearch or LinkedIn API. Never fabricate offers.
          PROMPT_EOF

          claude -p --dangerously-skip-permissions "$(cat "$TEMP_PROMPT_FILE")"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          MSG_FILE="data/daily/${DATE}-telegram.txt"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not configured. Skipping notification."
            exit 0
          fi

          if [ -f "$MSG_FILE" ]; then
            MSG=$(head -c 4000 "$MSG_FILE")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || true
          else
            MSG="🎯 Job Hunter — ${DATE}

⚠️ No results generated today. Check workflow logs."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || true
          fi
