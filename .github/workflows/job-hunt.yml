name: Job Hunter

on:
  schedule:
    - cron: '0 7 * * *' # Every day at 8:00 Geneva (7:00 UTC)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  id-token: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare LinkedIn cookie
        run: echo "$LINKEDIN_COOKIE" > /tmp/linkedin_cookie.txt
        env:
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Git
        run: |
          git config user.name "Magino"
          git config user.email "13470680+Onigam@users.noreply.github.com"

      - name: Run Job Hunter with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Prefer OAuth token (Claude Pro plan — no API credits needed).
          # If OAuth is present, unset API key to avoid precedence conflicts.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          fi

          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ Missing Claude credentials. Configure CLAUDE_CODE_OAUTH_TOKEN (recommended) or ANTHROPIC_API_KEY."
            exit 1
          fi

          claude -p --dangerously-skip-permissions --output-format text < .claude/prompts/job-hunter-orchestrator.md

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          MSG_FILE="data/daily/${DATE}-telegram.txt"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not configured. Skipping notification."
            exit 0
          fi

          if [ -f "$MSG_FILE" ]; then
            # Telegram has a 4096 char limit, truncate if needed
            MSG=$(head -c 4000 "$MSG_FILE")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || echo "⚠️ Telegram send failed, trying without markdown"

            # Retry without markdown if it failed
            if [ $? -ne 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode text="$MSG"
            fi
          else
            echo "No Telegram message file found for today (${MSG_FILE})"
            MSG="🎯 Job Hunter — ${DATE}

          ⚠️ No results generated today. Check workflow logs."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$MSG" \
              -d parse_mode="Markdown" || true
          fi
